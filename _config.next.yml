# NexT Theme Configuration
# Docs: https://theme-next.js.org/docs/theme-settings/

# Scheme
scheme: Gemini

# Dark Mode
darkmode: true

# Favicon
favicon:
  small: /images/favicon-16x16.png
  medium: /images/favicon-32x32.png

# Menu
menu:
  home: / || fa fa-home
  about: /about.html || fa fa-user
  tags: /tags.html || fa fa-tags
  categories: /categories.html || fa fa-th
  archives: /archives || fa fa-archive
  友链: /links.html || fa fa-link
  时间轴: /timeline.html || fa fa-clock

# Sidebar
sidebar:
  position: right
  display: post

# Avatar
avatar:
  url: /images/avatar.png
  rounded: true

# Social Links
social:
  GitHub: https://github.com/HeminWon || fab fa-github

# Creative Commons
creative_commons:
  license: by-nc-sa
  sidebar: true
  post: true
  language: deed.zh

# Code Highlight
codeblock:
  highlight_theme: normal
  copy_button:
    enable: true
    show_result: true
    style: flat

# Table of Content
toc:
  enable: true
  number: true
  wrap: true
  expand_all: true

# Footer
footer:
  since: 2018
  powered: true
  theme:
    enable: true
    version: true

# Local Search
local_search:
  enable: true
  trigger: auto
  top_n_per_article: 1
  unescape: true
  preload: false

# Reading Progress
reading_progress:
  enable: true
  start_at: left
  position: top
  reversed: false
  height: 3px

# Back to Top
back2top:
  enable: true
  sidebar: false
  scrollpercent: true
