# Hexo Configuration
## Docs: https://hexo.io/docs/configuration.html
## Source: https://github.com/hexojs/hexo/

# Site
title: HeMin's Blog
subtitle: iOS Dev.
description: Keep the dream alive
author: Hemin Won
language: zh-CN
timezone: Asia/Shanghai

# URL
url: https://heminwon.github.io/blog
root: /blog/
permalink: archives/:title.html
permalink_defaults: :title.html

# Directory
source_dir: source
public_dir: public
tag_dir: tags
archive_dir: archives
category_dir: categories
code_dir: downloads/code
i18n_dir: :lang
skip_render:

# Writing
new_post_name: :title.md
default_layout: post
titlecase: false
external_link:
  enable: true
  field: site
  exclude: []
filename_case: 0
render_drafts: false
post_asset_folder: false
relative_link: false
future: true

# Home page setting
index_generator:
  path: ''
  per_page: 10
  order_by: -date

# Category & Tag
default_category: uncategorized
category_map:
tag_map:

# Date / Time format
date_format: YYYY-MM-DD
time_format: HH:mm:ss

# Pagination
per_page: 10
pagination_dir: page

# Syntax Highlighting (Hexo 7 built-in)
syntax_highlighter: highlight.js

# Updated option
updated_option: date

# Extensions
## Plugins: https://hexo.io/plugins/
## Themes: https://hexo.io/themes/
theme: next

# RSS Feed
feed:
  type: atom
  path: atom.xml
  limit: 20
  hub:

# Sitemap
sitemap:
  path: sitemap.xml

# Search
search:
  path: search.xml
  field: post
  content: true

# Deployment
deploy:
  type: git
  repository: https://github.com/HeminWon/blog.git
  branch: gh-pages
  message: "Site updated: {{ now('YYYY-MM-DD HH:mm:ss') }}"
