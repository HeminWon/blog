language: node_js
node_js: stable
branches:
  only:
  - master
cache:
  yarn: true
  directories:
    - node_modules
before_install:
- git submodule init
- git submodule update
- cd _hexo
install:
- npm install
- npm install -g hexo-cli
before_script: 
script:
- hexo clean
- hexo generate
after_success:
- git config --global user.name "HeminWon"
- git config --global user.email "waiting4254@gmail.com"
- sed -i'' "/^ *repo/s~github\.com~${GH_TOKEN}@github.com~" _config.yml
- hexo deploy --silent
notifications:
  email:
  - waiting4254@gmail.com
  on_success: change
  on_failure: always
env:
  global:
    secure: 